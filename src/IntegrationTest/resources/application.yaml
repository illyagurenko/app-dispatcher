spring:
  application:
    name: app-dispatcher-it

  datasource:
    url: jdbc:h2:mem:dispatcher_it_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS "ACC_APP_DISPATCHER"\;CREATE DOMAIN IF NOT EXISTS "TEXT" AS VARCHAR
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  liquibase:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        globally_quoted_identifiers: true
