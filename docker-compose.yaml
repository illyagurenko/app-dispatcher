services:
  postgres_dispatcher:
    image: postgres:16-alpine
    container_name: postgres_dispatcher
    command: >
      postgres
      -c timezone=Europe/Moscow
      -c synchronous_commit=off
      -c shared_buffers=512MB
      -c checkpoint_timeout=15min
    environment:
      POSTGRES_DB: dispatcher_db
      POSTGRES_USER: dispatcher_user
      POSTGRES_PASSWORD: root
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "5434:5432"
    volumes:
      - postgres_dispatcher_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher_user -d dispatcher_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - food_bridge

volumes:
  postgres_dispatcher_data:

networks:
  default:
  food_bridge:
    external: true
